<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CUBEWORLD v0.9.7</title>
<style>
    body { margin:0; overflow:hidden; background: #87ceeb; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
    
    /* СТИЛИ МЕНЮ */
    #main-menu, #pause-menu {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 1000; background: rgba(0,0,0,0.1);
    }
    #pause-menu { display: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    #game-title, .pause-title {
        font-size: 90px; color: white; font-weight: 900; letter-spacing: 8px;
        text-shadow: 4px 4px 0px #2d521c, 8px 8px 20px rgba(0,0,0,0.5);
        margin-bottom: 50px; font-family: 'Arial Black', sans-serif;
    }
    .pause-title { font-size: 50px; margin-bottom: 30px; }
    .menu-btn {
        width: 320px; padding: 18px; margin: 10px; background: #333; color: white; 
        border: 4px solid #000; text-align: center; font-weight: bold; cursor: pointer; 
        font-size: 20px; transition: 0.2s; box-shadow: 0 5px 0 #111;
    }
    .menu-btn:hover { background: #5c8c32; border-color: #fff; transform: translateY(-3px); box-shadow: 0 8px 0 #3a5a1e; }
    #version-info { position: absolute; bottom: 15px; left: 15px; color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000; }

    /* ОРИГИНАЛЬНЫЕ СТИЛИ */
    #crosshair { position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px; z-index:10; pointer-events:none; display:none; }
    #crosshair:before, #crosshair:after { content:''; position:absolute; background:white; mix-blend-mode: difference; }
    #crosshair:before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
    #crosshair:after { top:50%; left:0; width:100%; height:2px; margin-top:-1px; }
    
    #inv-menu { position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; backdrop-filter: blur(8px); }
    .grid { display:grid; grid-template-columns: repeat(4, 100px); gap:15px; background: #222; padding:25px; border:4px solid #444; border-radius: 10px; }
    .slot { width:100px; height:100px; background:#333; border:3px solid #555; cursor:pointer; display:flex; flex-direction: column; align-items:center; justify-content:center; color:white; font-size: 10px; font-weight:bold; transition: 0.2s; position: relative; text-align: center; }
    .slot:hover { background:#444; border-color: #fff; transform: scale(1.05); z-index: 5; }
    .slot.active { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
    .icon-canvas { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }

    #console-container { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); display: none; padding: 15px; box-sizing: border-box; z-index: 5000; border-top: 3px solid #00ff00; }
    #console-input { width: 100%; background: transparent; border: none; color: #00ff00; outline: none; font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; }
    #coords-display { position: fixed; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; font-family: monospace; display: none; z-index: 50; border-radius: 5px; pointer-events: none; }
</style>
</head>
<body>

<div id="main-menu">
    <div id="game-title">CUBEWORLD</div>
    <div class="menu-btn" onclick="startGame()">Одиночный Мир</div>
    <div class="menu-btn" onclick="location.reload()">Выход</div>
    <div id="version-info">(0.9.7|Biome Update|)</div>
</div>

<div id="pause-menu">
    <div class="pause-title">Меню паузы</div>
    <div class="menu-btn" onclick="resumeGame()">Продолжить</div>
    <div class="menu-btn" onclick="location.reload()">Выход в главное меню</div>
</div>

<div id="crosshair"></div>
<div id="coords-display"></div>

<div id="inv-menu">
    <div style="color:white; margin-bottom:10px; font-size:24px; letter-spacing: 2px;">ВЫБОР БЛОКА</div>
    <div style="color:#aaa; margin-bottom:20px; font-size:14px;">Выбери блок для строительства</div>
    <div class="grid" id="block-grid"></div>
</div>

<div id="console-container">
    <input type="text" id="console-input" placeholder="Введите команду (например: /fly)">
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155/build/three.min.js"></script>
<script>
let isPaused = true;
let realPause = false;
let menuRotation = 0;
let dayCount = 0;
let gameTime = 0;

function startGame() {
    isPaused = false; realPause = false;
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('pause-menu').style.display = 'none';
    document.getElementById('crosshair').style.display = 'block';
    document.body.requestPointerLock();
    updateHandModel();
}

function resumeGame() {
    isPaused = false; realPause = false;
    document.getElementById('pause-menu').style.display = 'none';
    document.body.requestPointerLock();
}

function togglePauseMenu() {
    if (document.getElementById('main-menu').style.display === 'none' && !consoleOpen) {
        realPause = !realPause;
        isPaused = realPause;
        document.getElementById('pause-menu').style.display = realPause ? 'flex' : 'none';
        if (!realPause) document.body.requestPointerLock();
        else document.exitPointerLock();
    }
}

/* ================= WORLD LOGIC ================= */
const CHUNK_SIZE = 40; 
const RENDER_DIST = 2; 
const worldChunks = new Map();
let invOpen = false, consoleOpen = false, showCoords = false;
let canFly = false, isFlying = false, lastSpaceTime = 0;

const blockColors = {
    grass: "#4d8c32", stone: "#7a7a7a", sand: "#d9cc96", 
    wood: "#5d4037", leaf: "#2d5a1e", brick: "#8c3a3a", 
    diamond: "#00e5ff", glass: "#aaddff", glowstone: "#fff2a1", 
    cactus: "#2d4c1e", door: "#8d6e63",
    charred_grass: "#1a1a1a", charred_stone: "#0d0d0d"
};
const blockList = Object.keys(blockColors);
let selectedBlock = 'grass'; 

function createRealisticTex(type) {
    const canvas = document.createElement("canvas");
    canvas.width = 16; canvas.height = 16;
    const ctx = canvas.getContext("2d");
    const paint = (base, detail, amount=60) => {
        ctx.fillStyle = base; ctx.fillRect(0,0,16,16);
        for(let i=0; i<amount; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? detail : `rgba(0,0,0,0.3)`;
            ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
        }
    };
    if(type==='grass') { paint(blockColors.grass, "#3a6b24", 80); ctx.fillStyle="#2d521c"; ctx.fillRect(0,0,16,1); }
    else if(type==='charred_grass') { paint("#111", "#222", 100); ctx.fillStyle="#000"; ctx.fillRect(0,0,16,2); }
    else if(type==='stone' || type==='charred_stone') { paint(blockColors[type], "#333", 100); }
    else if(type==='sand') { paint(blockColors.sand, "#c2b478", 50); }
    else if(type==='wood') { paint(blockColors.wood, "#3e2723", 40); ctx.fillStyle="#2d1b17"; ctx.fillRect(0,4,16,1); ctx.fillRect(0,11,16,1); }
    else if(type==='leaf') { paint(blockColors.leaf, "#1b3d11", 120); }
    else if(type==='brick') { paint(blockColors.brick, "#5e2626", 30); ctx.fillStyle="#bbb"; ctx.fillRect(0,7,16,1); ctx.fillRect(8,0,1,7); }
    else if(type==='diamond') { paint(blockColors.diamond, "#00b8d4", 60); ctx.fillStyle="#fff"; ctx.fillRect(4,4,2,2); }
    else if(type==='glass') { ctx.fillStyle="rgba(170, 221, 255, 0.4)"; ctx.fillRect(0,0,16,16); ctx.strokeStyle="#fff"; ctx.strokeRect(1,1,14,14); }
    else if(type==='glowstone') { paint(blockColors.glowstone, "#fff", 80); }
    else if(type==='cactus') { paint(blockColors.cactus, "#1a2e12", 60); ctx.fillStyle="#000"; ctx.fillRect(7,2,2,2); ctx.fillRect(3,8,2,2); }
    else paint("#fff", "#ccc");
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = tex.minFilter = THREE.NearestFilter;
    return tex;
}

const mats = {};
Object.keys(blockColors).forEach(key => {
    mats[key] = new THREE.MeshStandardMaterial({
        map: createRealisticTex(key), 
        transparent: key==='glass' || key === 'door', 
        opacity: key==='glass'?0.4:1,
        emissive: key==='glowstone' ? "#fff2a1" : 0x000000,
        emissiveIntensity: key==='glowstone' ? 1.0 : 0
    });
});
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const doorGeo = new THREE.BoxGeometry(1, 2, 0.3);
const outline = new THREE.LineSegments(new THREE.EdgesGeometry(blockGeo), new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
outline.visible = false;

/* ================= 3D ICONS ================= */
const iconScene = new THREE.Scene();
const iconLight = new THREE.DirectionalLight(0xffffff, 1.5);
iconLight.position.set(2, 4, 3);
iconScene.add(iconLight, new THREE.AmbientLight(0xffffff, 0.5));
const iconCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
iconCamera.position.set(1.8, 1.8, 1.8);
iconCamera.lookAt(0, 0, 0);
const iconRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
iconRenderer.setSize(100, 100);
const iconMesh = new THREE.Mesh(blockGeo, mats.grass);
iconScene.add(iconMesh);

function get3DIcon(type) {
    if(!mats[type]) return document.createElement('div');
    iconMesh.material = mats[type];
    iconMesh.geometry = type === 'door' ? doorGeo : blockGeo;
    iconMesh.scale.setScalar(type === 'door' ? 0.5 : 1);
    iconRenderer.render(iconScene, iconCamera);
    const c = document.createElement('canvas');
    c.width = 100; c.height = 100;
    c.className = 'icon-canvas';
    c.getContext('2d').drawImage(iconRenderer.domElement, 0, 0);
    return c;
}

const particles = [];
function createParticles(pos, color) {
    const pGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const pMat = new THREE.MeshBasicMaterial({ color: color });
    for(let i=0; i<30; i++) {
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)));
        p.userData.vel = new THREE.Vector3((Math.random()-0.5)*0.35, Math.random()*0.35, (Math.random()-0.5)*0.35);
        p.userData.life = 1.0;
        scene.add(p);
        particles.push(p);
    }
}

const scene = new THREE.Scene();
scene.add(outline);
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.025);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
scene.add(sunLight);

const player = { pos: new THREE.Vector3(5, 35, 5), vel: new THREE.Vector3(0, 0, 0), w: 0.4, h: 1.8, onGround: false };
let handGroup = new THREE.Group();
camera.add(handGroup); scene.add(camera);
let swingProgress = 0, isSwinging = false;

function updateHandModel() {
    handGroup.clear();
    const isDoor = selectedBlock === 'door';
    const item = new THREE.Mesh(isDoor ? doorGeo : blockGeo, mats[selectedBlock]);
    item.scale.set(0.3, 0.3, 0.3); item.position.set(0.6, -0.5, -0.8);
    item.rotation.set(0.2, -0.4, 0); handGroup.add(item);
}

function getBlock(x, y, z) {
    const cx = Math.floor(x/CHUNK_SIZE), cz = Math.floor(z/CHUNK_SIZE);
    const chunk = worldChunks.get(`${cx},${cz}`);
    return chunk ? chunk.blocks.get(`${Math.round(x - cx*CHUNK_SIZE)},${Math.round(y)},${Math.round(z - cz*CHUNK_SIZE)}`) : null;
}

function collide(pos) {
    if(isFlying) return false;
    const r = player.w;
    const checkY = [-1.5, -0.8, 0.1];
    for(let y of checkY) for(let x of [-r, r]) for(let z of [-r, r]) if(getBlock(pos.x+x, pos.y+y, pos.z+z)) return true;
    return false;
}

function spawnTree(chunk, x, y, z) {
    const h = 4 + Math.floor(Math.random() * 3);
    for(let i=1; i<=h; i++) chunk.blocks.set(`${x},${y+i},${z}`, 'wood');
    for(let ly=-2; ly<=2; ly++) {
        for(let lx=-2; lx<=2; lx++) {
            for(let lz=-2; lz<=2; lz++) {
                if(Math.sqrt(lx*lx + ly*ly + lz*lz) < 2.5 + Math.random()) {
                    const p = `${x+lx},${y+h+ly},${z+lz}`;
                    if(!chunk.blocks.has(p)) chunk.blocks.set(p, 'leaf');
                }
            }
        }
    }
}

const blockLights = new Map();
const doors = new Map();

function createDoor(pos) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(doorGeo, mats.door);
    mesh.castShadow = true; mesh.receiveShadow = true;
    
    // Окно в двери
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.32), mats.glass);
    win.position.set(0, 0.4, 0);
    mesh.add(win);
    
    mesh.position.set(0.5, 1, 0); // Центр вращения по краю
    group.add(mesh);
    group.position.set(pos.x - 0.5, pos.y, pos.z);
    group.userData = { isOpen: false, type: 'door' };
    scene.add(group);
    doors.set(`${pos.x},${pos.y},${pos.z}`, group);
}

class Chunk {
    constructor(cx, cz) {
        this.cx = cx; this.cz = cz; this.blocks = new Map();
        this.group = new THREE.Group(); this.group.position.set(cx*CHUNK_SIZE, 0, cz*CHUNK_SIZE);
        scene.add(this.group);
        const distFromSpawn = Math.sqrt(cx*cx + cz*cz);
        this.isDeadLands = (distFromSpawn > 100) && (Math.abs(cx) % 20 === 0 && Math.abs(cz) % 20 === 0);
        this.generate();
    }
    generate() {
        const isDesert = !this.isDeadLands && (this.cx >= 2 && this.cx < 5 && this.cz >= 2 && this.cz < 5);
        const surface = this.isDeadLands ? 'charred_grass' : (isDesert ? 'sand' : 'grass');
        const under = this.isDeadLands ? 'charred_stone' : (isDesert ? 'sand' : 'stone');
        for(let x=0; x<CHUNK_SIZE; x++) for(let z=0; z<CHUNK_SIZE; z++) {
            const gx = this.cx*CHUNK_SIZE+x, gz = this.cz*CHUNK_SIZE+z;
            const h = Math.floor(10 + Math.sin(gx*0.06)*4 + Math.cos(gz*0.06)*4);
            this.blocks.set(`${x},${h},${z}`, surface);
            this.blocks.set(`${x},${h-1},${z}`, under);
            if(!this.isDeadLands && Math.random() > 0.993) {
                if(isDesert) {
                    const ch = 2 + Math.floor(Math.random()*2);
                    for(let i=1; i<=ch; i++) this.blocks.set(`${x},${h+i},${z}`, 'cactus');
                } else spawnTree(this, x, h, z);
            }
        }
        this.rebuild();
    }
    rebuild() {
        this.group.clear();
        const types = {};
        this.blocks.forEach((t, p) => { if(!types[t]) types[t] = []; types[t].push(p.split(',').map(Number)); });
        for(const t in types) {
            const inst = new THREE.InstancedMesh(blockGeo, mats[t], types[t].length);
            inst.castShadow = true;
            inst.receiveShadow = true;
            const dummy = new THREE.Object3D();
            types[t].forEach((p, i) => { dummy.position.set(p[0], p[1], p[2]); dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix); });
            this.group.add(inst);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(isPaused) {
        menuRotation += 0.003;
        camera.position.set(Math.cos(menuRotation)*25, 30, Math.sin(menuRotation)*25);
        camera.lookAt(0, 15, 0);
    } 
    else {
        gameTime += 0.001;
        if(gameTime > 1) { gameTime = 0; dayCount++; }

        if(showCoords) {
            const cx = Math.floor(player.pos.x/CHUNK_SIZE), cz = Math.floor(player.pos.z/CHUNK_SIZE);
            const biomeName = (Math.sqrt(cx*cx+cz*cz) > 100 && Math.abs(cx)%20===0 && Math.abs(cz)%20===0) ? "Dead Lands" : 
                              (cx>=2 && cx<5 && cz>=2 && cz<5) ? "Desert" : "Plains";
            document.getElementById('coords-display').innerHTML = `X: ${player.pos.x.toFixed(1)} | Y: ${player.pos.y.toFixed(1)} | Z: ${player.pos.z.toFixed(1)}<br>Biome: ${biomeName}<br>Fly: ${canFly ? (isFlying ? "FLYING" : "READY") : "OFF"}<br><b>DAY: ${dayCount}</b>`;
        }

        if(!invOpen && !consoleOpen) {
            const speed = isFlying ? 0.28 : (keys.ShiftLeft ? 0.12 : 0.07);
            const move = new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0), 0, (keys.KeyS?1:0)-(keys.KeyW?1:0)).normalize().multiplyScalar(speed).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
            
            player.pos.x += move.x; if(collide(player.pos)) player.pos.x -= move.x;
            player.pos.z += move.z; if(collide(player.pos)) player.pos.z -= move.z;

            if(isFlying) {
                if(keys.Space) player.pos.y += 0.15;
                if(keys.ShiftLeft) player.pos.y -= 0.15;
            } else {
                player.vel.y -= 0.012; player.pos.y += player.vel.y;
                if(collide(player.pos)) {
                    if(player.vel.y < 0) { player.pos.y = Math.round(player.pos.y); player.onGround = true; }
                    else player.pos.y -= player.vel.y;
                    player.vel.y = 0;
                } else player.onGround = false;
                if(player.onGround && keys.Space) player.vel.y = 0.22;
            }
            camera.position.copy(player.pos);
            sunLight.position.set(player.pos.x + 50, 100, player.pos.z + 50);
            sunLight.target.position.copy(player.pos);
            sunLight.target.updateMatrixWorld();

            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const meshes = Array.from(worldChunks.values()).flatMap(c => c.group.children);
            const doorObjs = Array.from(doors.values());
            const hits = raycaster.intersectObjects([...meshes, ...doorObjs], true);
            
            if(hits.length > 0 && hits[0].distance < 8) {
                const hit = hits[0];
                if(hit.object.parent && hit.object.parent.userData.type === 'door') {
                   outline.visible = false; 
                } else {
                    const m = new THREE.Matrix4();
                    hit.object.getMatrixAt(hit.instanceId, m);
                    const p = new THREE.Vector3().setFromMatrixPosition(m).add(hit.object.parent.position);
                    outline.position.copy(p); outline.visible = true;
                }
            } else outline.visible = false;

            if(isSwinging) {
                swingProgress += 0.05; 
                handGroup.rotation.x = Math.sin(swingProgress * Math.PI) * -1.3;
                if(swingProgress >= 1) { isSwinging = false; swingProgress = 0; handGroup.rotation.set(0,0,0); }
            }
        }
    }

    const viewPos = isPaused ? new THREE.Vector3(0,0,0) : player.pos;
    const pCX = Math.floor(viewPos.x/CHUNK_SIZE), pCZ = Math.floor(viewPos.z/CHUNK_SIZE);
    for(let x=pCX-RENDER_DIST; x<=pCX+RENDER_DIST; x++) for(let z=pCZ-RENDER_DIST; z<=pCZ+RENDER_DIST; z++) 
        if(!worldChunks.has(`${x},${z}`)) worldChunks.set(`${x},${z}`, new Chunk(x,z));

    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i]; p.position.add(p.userData.vel); p.userData.vel.y -= 0.008;
        p.userData.life -= 0.008; p.scale.setScalar(p.userData.life);
        if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
    }
    renderer.render(scene, camera);
}

/* ================= HANDLERS ================= */
const consoleInput = document.getElementById('console-input');
const keys = {};
let yaw = 0, pitch = 0;
const raycaster = new THREE.Raycaster();

document.addEventListener('mousemove', e => {
    if(!isPaused && !invOpen && !consoleOpen && document.pointerLockElement) {
        yaw -= e.movementX*0.002; pitch -= e.movementY*0.002;
        pitch = Math.max(-1.5, Math.min(1.5, pitch));
        camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
});

document.addEventListener('keydown', e => { 
    if(e.code === 'Backquote') { togglePauseMenu(); return; }
    if(consoleOpen) return;
    if(isPaused) return; 
    
    if(e.code==='KeyE') {
        invOpen = !invOpen; document.getElementById('inv-menu').style.display = invOpen?'flex':'none';
        if(!invOpen) document.body.requestPointerLock(); else { document.exitPointerLock(); updateUI(); }
    }
    if(e.code==='KeyT') { 
        e.preventDefault(); 
        consoleOpen = true; 
        for (let k in keys) keys[k] = false;
        document.getElementById('console-container').style.display = 'block';
        document.exitPointerLock(); 
        setTimeout(() => consoleInput.focus(), 50);
        return;
    }
    if(e.code==='Digit0') { showCoords = !showCoords; document.getElementById('coords-display').style.display = showCoords ? 'block' : 'none'; }
    if(e.code==='Space' && canFly) {
        const now = Date.now();
        if(now - lastSpaceTime < 250) { isFlying = !isFlying; player.vel.y = 0; }
        lastSpaceTime = now;
    }
    keys[e.code]=true; 
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

consoleInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
        const cmd = consoleInput.value.trim().toUpperCase();
        if(cmd === '/FLY') { canFly = !canFly; if(!canFly) isFlying = false; } 
        else if(cmd === '/TP WORLD') { player.pos.set(5, 35, 5); player.vel.set(0, 0, 0); } 
        else if(cmd === '/TP SANDWORLD') { player.pos.set(140, 35, 140); player.vel.set(0, 0, 0); } 
        else if(cmd === '/TP DARKWORLD') { player.pos.set(4000, 35, 4000); player.vel.set(0, 0, 0); } 
        else if(cmd === '/JUMP') { player.pos.y += 3; player.vel.set(0, 0, 0); }
        else if(cmd === '/COMMANDS') { consoleInput.value = ''; consoleInput.placeholder = "/FLY, /TP WORLD, /TP SANDWORLD, /TP DARKWORLD, /JUMP"; return; }
        consoleInput.value = ''; consoleOpen = false; 
        document.getElementById('console-container').style.display = 'none';
        document.body.requestPointerLock();
    }
    if(e.key === 'Escape') { consoleOpen = false; document.getElementById('console-container').style.display = 'none'; document.body.requestPointerLock(); }
});

window.addEventListener('mousedown', e => {
    if(isPaused || invOpen || consoleOpen) return;
    isSwinging = true; swingProgress = 0;
    raycaster.setFromCamera(new THREE.Vector2(), camera);
    
    // Проверка взаимодействия с дверью (Правая кнопка)
    if(e.button === 2) {
        const doorHits = raycaster.intersectObjects(Array.from(doors.values()), true);
        if(doorHits.length > 0) {
            const doorGroup = doorHits[0].object.parent;
            doorGroup.userData.isOpen = !doorGroup.userData.isOpen;
            doorGroup.rotation.y = doorGroup.userData.isOpen ? Math.PI/2 : 0;
            return;
        }
    }

    const meshes = Array.from(worldChunks.values()).flatMap(c => c.group.children);
    const hits = raycaster.intersectObjects(meshes);
    if(hits.length > 0 && hits[0].distance < 8) {
        const hit = hits[0], m = new THREE.Matrix4(); hit.object.getMatrixAt(hit.instanceId, m);
        const p = new THREE.Vector3().setFromMatrixPosition(m).add(hit.object.parent.position);
        const chunk = worldChunks.get(`${hit.object.parent.position.x/CHUNK_SIZE},${hit.object.parent.position.z/CHUNK_SIZE}`);
        const lp = `${Math.round(p.x-chunk.group.position.x)},${Math.round(p.y)},${Math.round(p.z-chunk.group.position.z)}`;
        
        if(e.button === 0) { // Ломать
            createParticles(p, blockColors[chunk.blocks.get(lp)] || "#fff");
            if(chunk.blocks.get(lp) === 'glowstone') {
                const l = blockLights.get(`${p.x},${p.y},${p.z}`);
                if(l) { scene.remove(l); blockLights.delete(`${p.x},${p.y},${p.z}`); }
            }
            chunk.blocks.delete(lp); chunk.rebuild(); 
        } else if(e.button === 2) { // Ставить
            const np = p.clone().add(hit.face.normal);
            const tC = worldChunks.get(`${Math.floor(np.x/CHUNK_SIZE)},${Math.floor(np.z/CHUNK_SIZE)}`);
            if(tC) { 
                if(selectedBlock === 'door') {
                    createDoor(np);
                } else {
                    tC.blocks.set(`${Math.round(np.x-tC.group.position.x)},${Math.round(np.y)},${Math.round(np.z-tC.group.position.z)}`, selectedBlock); 
                    if(selectedBlock === 'glowstone') {
                        const pl = new THREE.PointLight(blockColors.glowstone, 15, 12);
                        pl.position.copy(np); pl.castShadow = true;
                        scene.add(pl);
                        blockLights.set(`${np.x},${np.y},${np.z}`, pl);
                    }
                    tC.rebuild(); 
                }
            }
        }
    }
});

function updateUI() {
    const gridEl = document.getElementById('block-grid'); gridEl.innerHTML = '';
    blockList.forEach(id => {
        const slot = document.createElement('div'); slot.className = 'slot' + (selectedBlock===id ? ' active' : '');
        slot.appendChild(get3DIcon(id));
        slot.onclick = () => { selectedBlock = id; updateHandModel(); updateUI(); };
        gridEl.appendChild(slot);
    });
}

window.addEventListener('contextmenu', e => e.preventDefault());
animate();
</script>
